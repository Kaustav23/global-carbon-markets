# ------------------------------------------------------------------------------
# Dimension 3: Cross-Border CBAM Benchmarks & Article 6.2/6.4 Transfer Parameters
# ------------------------------------------------------------------------------
cbam_architecture:
  # Statutory EU-CBAM Free Allocation Phase-Out Factor (Phi_CBAM) per Article 31 Regulation (EU) 2023/956
  eu_cbam_free_allocation_factor_phi:
    2026: 0.975
    2027: 0.950
    2028: 0.900
    2029: 0.775
    2030: 0.515
    2031: 0.390
    2032: 0.265
    2033: 0.140
    2034: 0.000
    2035: 0.000

  # UK-CBAM Phase-Out Schedule (Enters into force 1 January 2027 under UK Finance Act)
  uk_cbam_free_allocation_factor_phi:
    2026: 1.000   # Transitional / pre-implementation in 2026
    2027: 0.950
    2028: 0.890
    2029: 0.780
    2030: 0.550
    2031: 0.420
    2032: 0.280
    2033: 0.140
    2034: 0.000
    2035: 0.000

  # Product-Specific Benchmark Intensities (tCO2e / tonne product) for the 4 Exposed Sectors
  exposed_sector_benchmarks:
    iron_and_steel:
      eu_ets_product_benchmark_tco2_per_t: 1.328   # Integrated BF-BOF hot metal benchmark
      uk_ets_product_benchmark_tco2_per_t: 1.350
      india_avg_export_intensity_2026: 2.360
      china_avg_export_intensity_2026: 1.980
      india_eu_annual_export_volume_mt: 4.80
      india_uk_annual_export_volume_mt: 0.65

    aluminum:
      eu_ets_product_benchmark_tco2_per_t: 1.464   # Direct primary aluminum electrolysis benchmark
      uk_ets_product_benchmark_tco2_per_t: 1.480
      india_avg_export_intensity_2026: 15.350      # Total Scope 1 + captive coal power intensity
      india_direct_cbam_scope_intensity_2026: 2.150
      china_direct_cbam_scope_intensity_2026: 1.850
      india_eu_annual_export_volume_mt: 0.72
      india_uk_annual_export_volume_mt: 0.11

    cement:
      eu_ets_product_benchmark_tco2_per_t: 0.693   # Grey cement clinker benchmark
      uk_ets_product_benchmark_tco2_per_t: 0.705
      india_avg_export_intensity_2026: 0.630
      china_avg_export_intensity_2026: 0.660
      india_eu_annual_export_volume_mt: 0.35
      india_uk_annual_export_volume_mt: 0.08

