# ==============================================================================
# Global Carbon Compliance Architecture: India's CCTS vs. The World (2026-2035)
# Master Institutional Regulatory, Containment & Econometric Configuration
# ==============================================================================

metadata:
  project_title: "Global Carbon Compliance Architecture: India's CCTS vs. The World (2026-2035)"
  lead_architect: "Kaustav Goswami"
  version: "2.0.0"
  simulation_horizon:
    start_year: 2026
    end_year: 2035
    trading_days_per_year: 252
    monte_carlo_paths: 2500
    random_seed: 42

