    share_of_proceeds_adaptation_levy_pct: 0.05    # 5% mandatory SOP levy to UNFCCC Adaptation Fund
    overall_mitigation_omge_cancellation_pct: 0.02 # 2% mandatory OMGE net atmospheric cancellation
